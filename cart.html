<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Keranjang Saya | Ecommindo Jaya Persada</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="cart">

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <span class="brand-eyebrow">IT Consultant</span>
        <span class="brand-name">ECOMMINDO</span>
        <span class="brand-sub">Jaya Persada</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-page="home">Home</a>
      <a href="service.html" data-page="service">Service</a>
      <a href="about.html" data-page="about">About Us</a>
      <a href="contact.html" data-page="contact">Contact Us</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        🛒
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <span data-auth-slot></span>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="page-header">
    <div class="container">
      <span class="eyebrow">Keranjang</span>
      <h1>Keranjang <span class="gradient-text">Layanan</span> Saya</h1>
      <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Cart</span></div>
    </div>
  </section>

  <section style="padding-top:10px;">
    <div class="container" id="cartContainer"></div>
  </section>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0;justify-content:center;">
      <span>© 2026 PT Ecommindo Jaya Persada. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin("cart.html");

  const container = document.getElementById("cartContainer");

  async function render() {
    let cart;
    try {
      cart = await getCartSummary();
    } catch (e) {
      container.innerHTML = `<p style="color:var(--text-muted);">Gagal memuat keranjang. Pastikan server backend berjalan.</p>`;
      return;
    }

    const items = cart.items;

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon-badge">🛒</div>
          <h3>Keranjang Anda masih kosong</h3>
          <p>Jelajahi layanan kami dan pilih yang sesuai dengan kebutuhan bisnis Anda.</p>
          <div style="margin-top:24px;">
            <a href="service.html" class="btn btn-primary">Lihat Layanan</a>
          </div>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div class="cart-layout">
        <div>
          ${items
            .map(
              (s) => `
            <div class="cart-item reveal">
              <div class="icon-badge">${s.icon}</div>
              <div class="cart-item-info">
                <h4>${s.name}</h4>
                <span>${s.short_desc}</span>
              </div>
              <div class="cart-item-price">${formatRupiah(s.price)}</div>
              <button class="cart-remove" data-remove="${s.id}" aria-label="Hapus">✕</button>
            </div>`
            )
            .join("")}
        </div>
        <div class="summary-card reveal">
          <h3>Ringkasan Pesanan</h3>
          ${items
            .map(
              (s) => `<div class="summary-row"><span>${s.name}</span><span>${formatRupiah(s.price)}</span></div>`
            )
            .join("")}
          <div class="summary-total"><span>Total</span><span class="gradient-text">${formatRupiah(cart.total)}</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block">Lanjut ke Checkout</a>
        </div>
      </div>`;
    initReveal();

    container.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await removeFromCart(btn.getAttribute("data-remove"));
          await initNavbar();
          await render();
          showToast("Layanan dihapus dari keranjang.");
        } catch (err) {
          showToast(err.message);
        }
      });
    });
  }

  render();
</script>
</body>
</html>
