<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login / Register | Ecommindo Jaya Persada</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <span class="brand-eyebrow">IT Consultant</span>
        <span class="brand-name">ECOMMINDO</span>
        <span class="brand-sub">Jaya Persada</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-page="home">Home</a>
      <a href="service.html" data-page="service">Service</a>
      <a href="about.html" data-page="about">About Us</a>
      <a href="contact.html" data-page="contact">Contact Us</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        🛒
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <span data-auth-slot></span>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main>
  <div class="auth-shell">
    <div class="auth-card reveal">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" type="button">Login</button>
        <button class="auth-tab" data-tab="register" type="button">Register</button>
      </div>

      <div class="form-msg" id="authMsg"></div>

      <!-- Login -->
      <div class="auth-panel active" data-panel="login">
        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Email Aktif</label>
            <input type="email" id="loginEmail" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="field-hint" style="text-align:center;margin-top:18px;">Belum punya akun? <a href="#" class="gradient-text" data-switch="register" style="font-weight:700;">Daftar sekarang</a></p>
      </div>

      <!-- Register -->
      <div class="auth-panel" data-panel="register">
        <form id="registerForm">
          <div class="field">
            <label for="regName">Nama Lengkap</label>
            <input type="text" id="regName" required />
          </div>
          <div class="field">
            <label for="regPhone">Nomor Handphone</label>
            <input type="tel" id="regPhone" placeholder="08xxxxxxxxxx" required />
          </div>
          <div class="field">
            <label for="regEmail">Email Aktif</label>
            <input type="email" id="regEmail" required />
          </div>
          <div class="field">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" minlength="6" required />
          </div>
          <div class="field">
            <label for="regPassword2">Konfirmasi Password</label>
            <input type="password" id="regPassword2" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Daftar</button>
        </form>
        <p class="field-hint" style="text-align:center;margin-top:18px;">Sudah punya akun? <a href="#" class="gradient-text" data-switch="login" style="font-weight:700;">Login di sini</a></p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0;justify-content:center;">
      <span>© 2026 PT Ecommindo Jaya Persada. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const tabs = document.querySelectorAll(".auth-tab");
  const panels = document.querySelectorAll(".auth-panel");
  const authMsg = document.getElementById("authMsg");

  function switchTab(name) {
    tabs.forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
    panels.forEach((p) => p.classList.toggle("active", p.dataset.panel === name));
    authMsg.className = "form-msg";
  }

  tabs.forEach((t) => t.addEventListener("click", () => switchTab(t.dataset.tab)));
  document.querySelectorAll("[data-switch]").forEach((a) =>
    a.addEventListener("click", (e) => {
      e.preventDefault();
      switchTab(a.dataset.switch);
    })
  );

  const params = new URLSearchParams(window.location.search);
  const redirect = params.get("redirect") || "index.html";

  if (isLoggedIn()) {
    window.location.href = redirect;
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    try {
      await loginUser(email, password);
      authMsg.textContent = "Login berhasil! Mengalihkan...";
      authMsg.className = "form-msg success show";
      await initNavbar();
      setTimeout(() => (window.location.href = redirect), 500);
    } catch (err) {
      authMsg.textContent = err.message;
      authMsg.className = "form-msg error show";
    }
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fullName = document.getElementById("regName").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;
    const password2 = document.getElementById("regPassword2").value;

    if (password !== password2) {
      authMsg.textContent = "Konfirmasi password tidak cocok.";
      authMsg.className = "form-msg error show";
      return;
    }

    try {
      await registerUser({ fullName, phone, email, password });
      authMsg.textContent = "Registrasi berhasil! Mengalihkan...";
      authMsg.className = "form-msg success show";
      await initNavbar();
      setTimeout(() => (window.location.href = redirect), 500);
    } catch (err) {
      authMsg.textContent = err.message;
      authMsg.className = "form-msg error show";
    }
  });
</script>
</body>
</html>
